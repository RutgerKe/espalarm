# Board: ESPHome Starter Kit By Apollo (Apollo Automation)
# Definition: definitions/boards/apollo-esk-1/manifest.yaml

esphome:
  name: esphome-alarm
  friendly_name: ESPHome Alarm

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESPHome Alarm
    password: !secret fallback_password

captive_portal:

switch:
  - platform: gpio
    name: Accessory Power
    id: accessory_power
    internal: true
    pin: 4
    restore_mode: ALWAYS_ON
    setup_priority: 2000

web_server:
  version: "3"

http_request:
  timeout: 10s

binary_sensor:
  - platform: gpio
    name: "Relaiscontact"
    id: relaiscontact
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - http_request.post:
          url: !secret webhook
          request_headers:
            Content-Type: application/json
          json:
            alert_uid: !lambda |-
              return str_sprintf("relais-%08x-%08x",
                                random_uint32(), random_uint32());
            title: "Relaiscontact gesloten"
            state: "alerting"
            message: "GPIO6 is verbonden met GND."
